simulation:
  n_interactions: 10000   # Monte Carlo simulation round
  risk_threshold_percent: 1.0   # Safety line 1%

environment:
  ambient_temp_c: 25.0   # Ambient temperature in °C

heat_source:   # Bridgelux Vero 13 Gen 8 
# While all parameter should be on maximum operating
  drive_current_a: 1.25
  forward_voltage_v: 36.7
  heat_coefficient: 0.75
  max_case_temp_c: 105.0
  outer_dia_mm: 36.2

# Select heatsink by thermal resistance (r_th)
#   ModuleLED Micro 8680: 1.2 C/W
#   ModuleLED Micro 8560: 1.5 C/W
#   ModuleLED Nano 7050: 2.2 C/W
heatsink:
  heatsink_model: "ModuleLED Micro 8680"
  r_heatsink: 1.2

uncertainties:
  thermal_conductivity_unc: 0.10 # +/- 10% of datasheet value
  pad_thickness_unc: 0.10   # +/- 10% of datasheet value
  grease_blt: # Grease Bond Line Thickness (BLT)
    blt_min_mm: 0.075
    blt_max_mm: 0.150
  
constants:
  grease_density: 2.5 